<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<link rel="preload" as="style" href="./cluster-delivery.css" />
<link rel="preload" as="script" href="./cluster-delivery-data.js" />
<link rel="preload" as="script" href="./cluster-delivery-view.js" />
<title>AI Factory SRE · 交付与准入</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="./design-system.css" />
<link rel="stylesheet" href="./tailwind.css" />
<link rel="stylesheet" href="./room-buildout.css" />
<link rel="stylesheet" href="./hierarchy.css" />
<link rel="stylesheet" href="./cluster-delivery.css" />
</head>
<body class="app-icons-ready">
<div class="min-h-screen" style="background:var(--bg)">

  <!-- ==================== 顶栏 Header ==================== -->
  <header class="sticky top-0 z-40 border-b app-header" style="border-color:var(--border)">
    <div class="h-14 px-5 flex items-center gap-6">
      <div class="flex items-center gap-2.5" style="min-width:208px">
        <div class="w-8 h-8 rounded-lg site-brand-mark flex items-center justify-center">
          <span class="mat filled" style="color:#fff;font-size:20px">hub</span>
        </div>
        <div class="leading-tight">
          <div class="topbar-brand-line">
            <span style="font-size:15px;font-weight:600;color:var(--text-1)">AI Factory SRE</span>
            <span class="site-env-badge">Prototype</span>
          </div>
          <div style="font-size:11px;color:var(--text-3)">资源管理 · 稳定性运营平台</div>
        </div>
      </div>

      <div class="scene-switch ml-3" id="scene-switch">
        <button type="button" class="scene-switch-btn" aria-haspopup="true" aria-expanded="false">
          <span class="mat mat-sm">memory</span>
          <span>计算场景</span>
          <span class="mat mat-sm">expand_more</span>
        </button>
      </div>

      <div class="topbar-tools ml-auto flex items-center gap-3 shrink-0">
        <button class="btn btn-ghost btn-sm"><span class="mat mat-sm">search</span>搜索资源</button>
        <button class="btn btn-soft btn-sm"><span class="mat mat-sm">auto_awesome</span>诊断 Copilot</button>
        <div class="w-px h-6" style="background:var(--border)"></div>
        <button class="btn btn-ghost btn-sm px-2" aria-label="通知"><span class="mat mat-sm">notifications</span></button>
        <div class="topbar-user">
          <button type="button" class="topbar-user__trigger" aria-label="当前用户">
            <span class="topbar-user__avatar brand-grad text-white">本</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="flex app-shell">
    <!-- ==================== 侧栏 Sidebar（计算场景） ==================== -->
    <aside id="app-sidebar" class="w-[210px] shrink-0 border-r px-3 py-4 app-sidebar" tabindex="0" aria-label="主导航">
      <div class="sidebar-block" data-scene="compute">
        <div id="compute-sidebar-nav"></div>
      </div>
    </aside>

    <!-- ==================== 主内容 ==================== -->
    <main class="flex-1 min-w-0 p-5 space-y-5 app-main" id="main"></main>
  </div>
</div>

<script src="./data.js"></script>
<script src="./buildout-store.js"></script>
<script src="./ui-kit.js"></script>
<script src="./compute-nav-icons.js"></script>
<script src="./compute-ui-kit.js"></script>
<script src="./cluster-model.js"></script>
<script src="./sop-data.js"></script>
<script src="./buildout-actions.js"></script>
<script src="./navigation.js"></script>
<script src="./hierarchy-view.js"></script>
<script src="./detail-view.js"></script>
<script src="./cluster-delivery-data.js"></script>
<script src="./cluster-delivery-view.js"></script>
<script src="./app.js"></script>
</body>
</html>
